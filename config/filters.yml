# ---- Role matching (applied to job TITLE only, cheap pre-filter) ----
title_keywords:
  - machine learning
  - ml engineer
  - mlops
  - ai engineer
  - applied scientist
  - research engineer
  - research scientist
  - deep learning
  - nlp
  - llm
  - genai
  - generative ai
  - computer vision
  - data scientist
  - ai/ml
  - ml infrastructure
  - ml platform
  - prompt engineer
  - ai researcher
  - perception engineer
  # early-career surface area
  - associate machine learning
  - associate data scientist
  - junior machine learning
  - ml engineer i
  - ai engineer i
  - new grad
  - graduate engineer
  - early career

# Blocks BOTH directions: too junior and too senior. You are ~2 months into
# your first post-MS role, so Senior/Staff postings burn tokens and score ~40.
# Remove 'senior' and 'lead' in roughly a year.
title_blocklist:
  - intern
  - internship
  - director
  - vp
  - vice president
  - head of
  - principal
  - staff
  - senior
  - sr
  - lead
  - manager
  - recruiter
  - sales
  - marketing

# ---- Remote detection (matched against LOCATION field only) ----
remote_markers:
  - remote
  - anywhere
  - worldwide
  - work from home
  - wfh
  - global

onsite_markers:
  - hybrid
  - on-site
  - onsite
  - in-office
  - in office

# ---- Geography hard-reject (regex, matched against location string) ----
geo_hard_reject:
  - "us only"
  - "u\\.s\\. only"
  - "usa only"
  - "united states only"
  - "us-based only"
  - "must reside in the (us|united states)"
  - "canada only"
  - "uk only"
  - "eu only"
  - "emea only"
  - "latam only"
  - "brazil only"
  - "australia only"

# US state abbreviations, e.g. "Remote - CA". Matched as ", XX" or " - XX".
us_state_pattern: "[,\\-]\\s*(al|ak|az|ar|ca|co|ct|de|fl|ga|hi|id|il|in|ia|ks|ky|la|me|md|ma|mi|mn|ms|mo|mt|ne|nv|nh|nj|nm|ny|nc|nd|oh|ok|or|pa|ri|sc|sd|tn|tx|ut|vt|va|wa|wv|wi|wy|dc)\\b"

# A named region in the LOCATION field scopes the role to that region.
restricted_regions:
  - united states
  - usa
  - u\.s\.
  - us
  - americas
  - canada
  - united kingdom
  - uk
  - ireland
  - emea
  - europe
  - european union
  - eu
  - germany
  - france
  - poland
  - portugal
  - spain
  - netherlands
  - israel
  - australia
  - new zealand
  - japan
  - brazil
  - latam
  - mexico

# ...unless one of these also appears, which reopens it.
ok_regions:
  - india
  - worldwide
  - anywhere
  - global
  - apac
  - asia pacific

# ---- Your situation (fed to the LLM screen) ----
candidate_context:
  based_in: "Vadodara, India (IST, UTC+5:30)"
  work_authorization: "Authorized to work in India. No US/EU/UK work visa."
  experience_level: "Early career. MS in Artificial Intelligence completed 2026,
                     currently ~2 months into first full-time AI/ML role. Score
                     against entry-level and mid-level expectations, not senior."
  open_to: "Fully remote roles hiring from India, or global/worldwide roles.
            Contractor / EOR arrangements are fine."
  timezone_tolerance: "Can overlap up to ~4-5 hours with US Eastern or full overlap with EMEA."

# ---- Thresholds ----
match_threshold: 55      # lowered from 65 while the bullet bank is still thin
max_jobs_per_run: 30
max_resumes_per_run: 12